# ==========================================
# PaySim CONFIG — REPRODUCTION 100% PAPER
# (Paper: Cui et al., IEEE JOCS 2025)
# ==========================================

flags:
  federated: true
  rl: true

experiment:
  name: paysim_paper_repro
  dataset: paysim
  pipeline: fraudgnn_rl

dataset:
  name: PaySim
  path: data/raw/paysim_fast.csv       # Dùng file gốc (không phải paysim_fast.csv)
  label_col: isFraud
  time_col: step
  time_unit: hour
  sample_frac: 1.0                 # ✅ PAPER: dùng toàn bộ data
  random_state: 42

split:
  strategy: temporal
  train_ratio: 0.70
  val_ratio: 0.15

preprocess:
  numeric_strategy: mean           # ✅ PAPER
  categorical_strategy: most_frequent  # ✅ PAPER
  drop_cols: [isFlaggedFraud, nameOrig, nameDest]
  categorical_cols: [type]

graph:
  time_window_hours: 1.0           # ✅ PAPER
  similarity_threshold: 0.9        # ✅ PAPER
  # max_neighbors_per_node: null   # ✅ PAPER: không giới hạn (bỏ comment nếu OOM)

model:
  hidden_dim: 64                   # ✅ PAPER
  num_layers: 3                    # ✅ PAPER
  dropout: 0.2
  num_node_types: 5

train:
  epochs: 100                      # ✅ PAPER
  patience: 10                     # ✅ PAPER
  batch_size: 64                   # ✅ PAPER
  learning_rate: 0.001             # ✅ PAPER

rl:
  type: naf
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  tau: 0.005
  fpr_penalty: 0.5
  recall_weight: 0.25

federated:
  num_clients: 3
  rounds: 10
  local_epochs: 5
  learning_rate: 0.001