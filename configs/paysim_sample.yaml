# ============================================================
# CONFIG: PaySim - SAMPLE (GIỐNG PAPER 100% - EPOCHS 100)
# ============================================================
# ✅ GIỐNG PAPER 100%:
#   - Temporal split (70-15-15)
#   - batch_size: 64 / 256
#   - epochs: 100 ✅ GIỮ NGUYÊN
#   - max_neighbors_per_node: 3
#   - hidden_dim: 64, num_layers: 3
#   - similarity_threshold: 0.9
#   - federated: true
#   - Stratified random sampling (giữ tỷ lệ fraud)
#   - Graph alignment (Section IV.C)
#
# ⚠️ CHỈ KHÁC PAPER (để test nhanh):
#   - sample_frac: 0.05 (5% data - paper ko quy định)
#   - federated.rounds: 3 (giảm để test - paper ko quy định)
#   - federated.local_epochs: 1 (giảm để test - paper ko quy định)
#   - patience: 3 (giảm để test - paper ko quy định)
#   - rl.learning_rate: 0.0001 (giảm để ổn định)
#   - rl.fpr_penalty: 1.0 (tăng để giảm FPR)
# ============================================================

flags:
  hard_edges: true
  soft_edges: false
  hybrid_graph: false
  weighted_fusion: false
  federated: true
  rl: true
  pruning: false
  dqn: true

experiment:
  name: paysim_sample_10pct
  pipeline: fraudgnn_rl
  dataset: paysim

dataset:
  name: PaySim
  path: data/raw/paysim_fast.csv
  label_col: isFraud
  time_col: step
  time_unit: hour
  sample_frac: 0.05
  stratified_sampling: true
  random_state: 42

split:
  strategy: temporal
  train_ratio: 0.70
  val_ratio: 0.15

preprocess:
  drop_cols:
    - nameOrig
    - nameDest
    - isFlaggedFraud
  categorical_cols:
    - type
  numeric_strategy: median

graph:
  type: transaction_similarity
  time_window_hours: 1.0
  similarity_threshold: 0.9
  max_neighbors_per_node: 3
  add_self_loops: true

model:
  hidden_dim: 64
  num_layers: 3
  dropout: 0.20
  num_node_types: 1

train:
  epochs: 100                      # ✅ GIỮ NGUYÊN (giống paper)
  patience: 3
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001

rl:
  enabled: true
  threshold_bins:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
  fpr_penalty: 1.0
  epochs: 100                      # ✅ GIỮ NGUYÊN (giống paper)
  batch_size: 256
  learning_rate: 0.0001

federated:
  num_clients: 3
  rounds: 3
  local_epochs: 1
  learning_rate: 0.001
  batch_size: 64
  aggregation: fedavg
  align_graphs: true
  alignment_method: feature_projection

threshold_selection:
  metric: custom
  f1_weight: 1.0
  recall_weight: 0.8
  precision_weight: 0.1
  fpr_weight: 0.5
  max_fpr: 0.20
  min_recall: 0.30