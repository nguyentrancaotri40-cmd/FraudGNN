flags:
  hard_edges: true
  soft_edges: true
  hybrid_graph: true
  weighted_fusion: false
  federated: true
  rl: true
  pruning: false
  dqn: false

experiment:
  name: test_hybrid_federated
  pipeline: fraudgnn_rl
  dataset: paysim

dataset:
  name: PaySim
  path: data/raw/paysim_fast.csv
  label_col: isFraud
  time_col: step
  time_unit: hour
  sample_frac: 0.001
  stratified_sampling: true
  random_state: 42

split:
  strategy: temporal
  train_ratio: 0.70
  val_ratio: 0.15

preprocess:
  drop_cols:
    - nameOrig
    - nameDest
    - isFlaggedFraud
  categorical_cols:
    - type
  numeric_strategy: median

graph:
  type: transaction_similarity
  time_window_hours: 1.0
  similarity_threshold: 0.9
  max_neighbors_per_node: 2
  add_self_loops: true

model:
  hidden_dim: 16
  num_layers: 2
  dropout: 0.20
  num_node_types: 5

train:
  epochs: 2
  patience: 1
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001

rl:
  type: naf    
  enabled: true
  threshold_bins: [0.3, 0.5, 0.7]
  fpr_penalty: 0.5
  epochs: 1
  batch_size: 64
  tau: 0.005                     # ✅ THÊM

federated:
  num_clients: 2
  rounds: 1
  local_epochs: 1
  learning_rate: 0.001
  batch_size: 32
  aggregation: fedavg
  align_graphs: true
  alignment_method: shared_encoder

threshold_selection:
  metric: custom
  f1_weight: 1.0
  recall_weight: 0.8
  precision_weight: 0.1
  fpr_weight: 0.5
  max_fpr: 0.20
  min_recall: 0.30