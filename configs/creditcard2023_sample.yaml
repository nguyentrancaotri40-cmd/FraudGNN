# ============================================================
# CONFIG: CreditCard 2023 - SAMPLE (GIỐNG PAPER 100%)
# ============================================================
# ✅ GIỐNG PAPER 100%:
#   - Temporal split với stratified sampling (giữ tỷ lệ fraud)
#   - batch_size: 64 / 256
#   - epochs: 100
#   - max_neighbors_per_node: 3
#   - hidden_dim: 64, num_layers: 3
#   - similarity_threshold: 0.98
#   - federated: true
#   - Stratified random sampling (giữ tỷ lệ fraud)
#   - Graph alignment (Section IV.C)
#
# ⚠️ CHỈ KHÁC PAPER (để test nhanh):
#   - sample_frac: 0.3 (30% data - paper ko quy định)
#   - federated.rounds: 5 (giảm để test - paper ko quy định)
#   - federated.local_epochs: 2 (giảm để test - paper ko quy định)
#   - patience: 10 (giảm để test - paper ko quy định)
#   - rl.learning_rate: 0.0001 (giảm để DQN ổn định)
# ============================================================

flags:
  hard_edges: true
  soft_edges: false
  hybrid_graph: false
  weighted_fusion: false
  federated: true          # ✅ GIỐNG PAPER
  rl: true                 # ✅ GIỐNG PAPER
  pruning: false
  dqn: true

experiment:
  name: creditcard_sample_10pct
  pipeline: fraudgnn_rl
  dataset: creditcard

dataset:
  name: CreditCard2023
  path: data/raw/creditcard_2023_fast.csv
  label_col: Class
  time_col: id
  time_unit: index
  sample_frac: 0.3         # ✅ Tăng lên 30% để học tốt hơn
  stratified_sampling: true   # ✅ GIỐNG PAPER
  random_state: 42

split:
  strategy: stratified_temporal   # ✅ FIX: temporal + stratified (giữ tỷ lệ fraud)
  train_ratio: 0.70
  val_ratio: 0.15

preprocess:
  drop_cols:
    - id
  categorical_cols: []
  numeric_strategy: median

graph:
  type: transaction_similarity
  time_window_hours: 1000.0
  similarity_threshold: 0.98       # ✅ GIỐNG PAPER
  max_neighbors_per_node: 3        # ✅ GIỐNG PAPER
  add_self_loops: true

model:
  hidden_dim: 64                   # ✅ GIỐNG PAPER
  num_layers: 3                    # ✅ GIỐNG PAPER
  dropout: 0.20
  num_node_types: 1

train:
  epochs: 100                      # ✅ GIỐNG PAPER
  patience: 10                     # ✅ Tăng patience
  batch_size: 64                   # ✅ GIỐNG PAPER
  learning_rate: 0.001
  weight_decay: 0.0001

rl:
  enabled: true
  threshold_bins:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
  fpr_penalty: 0.5
  epochs: 100                      # ✅ GIỐNG PAPER
  batch_size: 256                  # ✅ GIỐNG PAPER
  learning_rate: 0.0001            # ✅ FIX: Giảm learning rate để DQN ổn định

federated:
  num_clients: 3
  rounds: 5                        # ⚠️ Giảm để test (paper ko quy định)
  local_epochs: 2                  # ⚠️ Giảm để test (paper ko quy định)
  learning_rate: 0.001
  batch_size: 64                   # ✅ GIỐNG PAPER
  aggregation: fedavg              # ✅ GIỐNG PAPER (Algorithm 1)
  align_graphs: true               # ✅ GIỐNG PAPER (Section IV.C)
  alignment_method: feature_projection

threshold_selection:
  metric: custom
  f1_weight: 1.0
  recall_weight: 0.8
  precision_weight: 0.1
  fpr_weight: 0.5
  max_fpr: 0.20
  min_recall: 0.30