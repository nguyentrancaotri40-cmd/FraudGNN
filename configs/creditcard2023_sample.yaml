# ============================================================
# CONFIG: CreditCard 2023 - SAMPLE (GIỐNG PAPER 100%)
# ============================================================
# ✅ GIỐNG PAPER 100%:
#   - Random split với stratified sampling (giữ tỷ lệ fraud)
#   - batch_size: 64 / 256
#   - epochs: 100
#   - max_neighbors_per_node: 3
#   - hidden_dim: 64, num_layers: 3
#   - similarity_threshold: 0.98
#   - federated: true
#   - Stratified random sampling (giữ tỷ lệ fraud)
#   - Graph alignment (Section IV.C)
#
# ⚠️ CHỈ KHÁC PAPER (để test nhanh):
#   - sample_frac: 0.3 (30% data - paper ko quy định)
#   - federated.rounds: 5 (giảm để test - paper ko quy định)
#   - federated.local_epochs: 2 (giảm để test - paper ko quy định)
#   - patience: 10 (giảm để test - paper ko quy định)
#   - rl.learning_rate: 0.0001 (giảm để DQN ổn định)
# ============================================================

flags:
  hard_edges: true
  soft_edges: false
  hybrid_graph: false
  weighted_fusion: false
  federated: true
  rl: true
  pruning: false
  dqn: true

experiment:
  name: creditcard_sample_10pct
  pipeline: fraudgnn_rl
  dataset: creditcard

dataset:
  name: CreditCard2023
  path: data/raw/creditcard_2023_fast.csv
  label_col: Class
  # ✅ FIX: Bỏ time_col (không dùng temporal cho Credit Card)
  # time_col: id
  # time_unit: index
  sample_frac: 0.3
  stratified_sampling: true      # ✅ FIX: true để giữ tỷ lệ fraud
  random_state: 42

split:
  # ✅ FIX: Dùng stratified_random thay vì stratified_temporal
  strategy: stratified_random    # ✅ GIỐNG PAPER (random split)
  train_ratio: 0.70
  val_ratio: 0.15

preprocess:
  drop_cols:
    - id
  categorical_cols: []
  numeric_strategy: median

graph:
  type: transaction_similarity
  time_window_hours: null
  similarity_threshold: 0.5
  max_neighbors_per_node: 10
  add_self_loops: true

model:
  hidden_dim: 64
  num_layers: 3
  dropout: 0.20
  num_node_types: 2

train:
  epochs: 100
  patience: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001

rl:
  enabled: true
  threshold_bins:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
  fpr_penalty: 0.5
  epochs: 100
  batch_size: 256
  learning_rate: 0.0001

federated:
  num_clients: 3
  rounds: 5
  local_epochs: 2
  learning_rate: 0.001
  batch_size: 64
  aggregation: fedavg
  align_graphs: true
  alignment_method: shared_encoder

threshold_selection:
  metric: custom
  f1_weight: 1.0
  recall_weight: 0.8
  precision_weight: 0.1
  fpr_weight: 0.5
  max_fpr: 0.20
  min_recall: 0.30